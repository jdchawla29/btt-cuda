name: BTT-CUDA CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9]
        pytorch-version: [1.9.*, 1.10.*]

    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
        python -m pip install torch==${{ matrix.pytorch-version }} -f https://download.pytorch.org/whl/cu111/torch_stable.html
        python -m pip install -e .
    
    - name: Run tests
      run: |
        pytest tests/
    
  benchmark:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch==1.10.* -f https://download.pytorch.org/whl/cu111/torch_stable.html
        python -m pip install pandas matplotlib tabulate
        python -m pip install -e .
    
    - name: Run benchmarks
      run: |
        mkdir -p benchmark_results
        python profiling/benchmark_optimized.py --repeats 5
        mv benchmark_results.png benchmark_results/
        mv benchmark_results.csv benchmark_results/
    
    - name: Archive benchmark results
      uses: actions/upload-artifact@v2
      with:
        name: benchmark-results
        path: benchmark_results/