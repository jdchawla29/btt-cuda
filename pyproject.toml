[build-system]
requires = ["setuptools>=42", "wheel", "torch>=1.7.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btt-cuda"
version = "0.1.0"
description = "Block Tensor-Train layer with CUDA acceleration"
readme = "README.md"
requires-python = ">=3.7"
authors = [
    {name = "Author", email = "author@example.com"}
]
dependencies = [
    "torch>=1.7.0",
    "numpy>=1.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]